schema_version: 1
project: StreamMulticast

# DRAFT: bootstrap map, owner review pending. No node is promoted to works.
lanes:
  foundation: "#3498db"
  core: "#2ecc71"
  pipeline: "#f39c12"
  ui: "#9b59b6"
  entry: "#e74c3c"

rules:
  - "Draft map from a read-only audit on 2026-10-19; unverified claims are marked UNVERIFIED in criteria."
  - "Platform URLs live in one table only (currently violated: two tables)."

ignore:
  - ".deps/**"
  - "build_x64/**"
  - "build_x64_vs18/**"
  - "build-aux/**"
  - "cmake/**"
  - "**/*.subagent"
  - "*.subagent"

# Generated or pre-existing untracked files that are not part of this change.
size_ignore:
  - "build_x64_vs18/**"
  - "build_tests/**"
  - "cmake/.CMakeBuildNumber"
  - "**/*.subagent"
  - "*.subagent"

nodes:
  - id: endpoint-model
    lane: foundation
    goal: "An endpoint is a plain value with identity, connection, encoder and framing settings."
    owns: [endpoint.fields-and-defaults, endpoint.uuid-identity]
    needs: []
    code:
      - src/core/Endpoint.hpp
      - src/core/Endpoint.cpp
      - src/core/CanvasMigration.hpp
      - src/core/CanvasMigration.cpp
      - tests/test_endpoint_defaults.cpp
      - tests/test_canvas_endpoint.cpp
    works_when:
      - id: endpoint-model.shape
        behavior: "Endpoint round-trips through obs_data without loss; missing keys get documented defaults."
        verification:
          - kind: automated
            reference: tests/test_endpoint_defaults.cpp
            check: endpoint_missing_bools_deserialize_to_defaults
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix (enabled/linked_to_main read false), passed after (WU2 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_endpoint_defaults.cpp
            check: endpoint_missing_numbers_deserialize_to_defaults
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix, passed after (WU2 commit)"
            checked_at: 2026-10-19
      - id: endpoint-model.canvas-ref
        behavior: "Endpoint carries canvas_uuid and canvas_name (both empty = main canvas), serialized as canvas_uuid/canvas_name; configs without the keys resolve to the main canvas."
        verification:
          - kind: automated
            reference: tests/test_canvas_endpoint.cpp
            check: canvas_endpoint_roundtrip_preserves_canvas_ref
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_, local run 2026-10-19; failed before implementation (build error, missing CanvasMigration.hpp), passed after (TASK-3)"
            checked_at: 2026-10-19
      - id: endpoint-model.key-provider
        behavior: "Endpoint carries key_provider ('' = manual, 'streamlabs_tiktok'), streamlabs_title, streamlabs_category_id and streamlabs_category_name, serialized under the same names; a missing or unknown key_provider loads as ''. Config schema stays 2. The key fetched at go-live is never stored in these fields."
        verification:
          - kind: automated
            reference: tests/test_streamlabs_tiktok.cpp
            check: streamlabs_tiktok_endpoint_key_provider_roundtrip
            result: passed
            run: "ctest --test-dir build_tests -C Release -R streamlabs_tiktok_, local run 2026-10-19; configure failed before implementation (missing src/core/StreamlabsTikTok.cpp), 11/11 passed after (TASK-28)"
            checked_at: 2026-10-19
    status: building
  - id: config-persistence
    lane: foundation
    goal: "Endpoint list survives restarts, debounced and crash-safe."
    owns: [config.file-schema, config.schema-version]
    needs: [endpoint-model]
    code:
      - src/core/ConfigStore.hpp
      - src/core/ConfigStore.cpp
    works_when:
      - id: config-persistence.roundtrip
        behavior: "Saved config.json loads back to an equal endpoint list; legacy schema versions are migrated."
        verification: []
      - id: config-persistence.legacy-orientation-migration
        behavior: "Schema 1 -> 2: orientation 1/2 becomes canvas_name 'StreamMulticast Vertical' with orientation SourceMatch, one LOG_WARNING per migrated endpoint (name only). The pure migration and the write-back decision are tested; a migrated config is written back atomically right after load (the original is kept once as config.json.v1.bak; a failed write-back logs a warning, stays dirty and is retried at shutdown or next start; shutdown flushes write at most once); the ConfigStore file I/O and the log line are not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_canvas_endpoint.cpp
            check: canvas_migrate_letterbox_to_vertical_canvas
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_, local run 2026-10-19; failed before implementation (build error), passed after (TASK-3)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_endpoint.cpp
            check: canvas_migrate_marks_config_dirty
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_migrat, local run 2026-10-19; failed before implementation (build error, missing migrate_config), passed after (TASK-24)"
            checked_at: 2026-10-19
    status: building
  - id: platform-server-table
    lane: foundation
    goal: "One table maps platform names to ingest URLs."
    owns: [platform.server-url-table]
    needs: []
    code:
      - src/core/ObsServiceImport.cpp
      - src/ui/EndpointDialog.cpp
    works_when:
      - id: platform-server-table.to-be-mapped
        behavior: "unknown - to be mapped. Two independent tables exist today (ObsServiceImport.cpp:29 and EndpointDialog.cpp:31) with different YouTube and Kick URLs."
        verification: []
    status: unknown
  - id: service-import
    lane: core
    goal: "Server and key can be imported from the active OBS profile or a TikTok bridge JSON."
    owns: [import.obs-profile-reader, import.tiktok-bridge-reader]
    needs: [platform-server-table]
    code:
      - src/core/ObsServiceImport.hpp
      - src/core/ObsServiceImport.cpp
      - src/core/TikTokBridgeImport.hpp
      - src/core/TikTokBridgeImport.cpp
    works_when:
      - id: service-import.obs-profile
        behavior: "Active-profile service.json yields server, key, service name or a readable error."
        verification: []
    status: building
  - id: endpoint-validation
    lane: core
    goal: "Invalid or duplicate endpoints (empty fields, bad scheme, same ingest and key twice) are rejected or warned before start."
    owns: [endpoint.validation-rules]
    needs: [endpoint-model]
    code:
      - src/core/EndpointValidation.hpp
      - src/core/EndpointValidation.cpp
      - src/core/MainServiceTarget.hpp
      - src/core/MainServiceTarget.cpp
      - tests/test_endpoint_validation.cpp
      - tests/test_linked_start_duplicates.cpp
    works_when:
      - id: endpoint-validation.dup-target
        behavior: "Two targets are duplicates when the normalized server (trimmed, scheme and host lowercased, trailing slashes and the scheme default port rtmp:1935 / rtmps:443 stripped; rtmp and rtmps stay distinct) and the non-empty stream key are equal. Checked against other enabled endpoints and the OBS main streaming service. The check is pure (find_duplicate); reading the main service via the frontend API (MainServiceTarget) is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_endpoint_validation.cpp
            check: duplicate_when_normalized_server_and_key_equal
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_endpoint_validation.cpp
            check: find_duplicate_detects_main_service
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: main service and a linked endpoint with identical server and key; the endpoint must be skipped with a warning in the log (not run in this session)"
            result: pending
    status: building
  - id: encoder-factory
    lane: pipeline
    goal: "Each endpoint gets a video and audio encoder matching its settings, with safe fallback."
    owns: [encoder.type-resolution, encoder.settings-mapping]
    needs: [endpoint-model]
    code:
      - src/pipeline/EncoderFactory.hpp
      - src/pipeline/EncoderFactory.cpp
    works_when:
      - id: encoder-factory.fallback
        behavior: "Unavailable GPU backend falls back to x264 with a log line."
        verification: []
      - id: encoder-factory.record-encoder
        behavior: "create_record_video_encoder builds the vertical recording encoder from a RecordEncoderChoice (rate_control plus quality key; x264 preset veryfast, profile high) on the caller's video_t, with the same set_video and lifetime rule as create_video_encoder; create_aac_encoder (name, bitrate, mix) is shared by endpoints and the recorder; available_encoder_types exposes the once-enumerated id set. Only compiled locally."
        verification: []
    status: building
  - id: canvas-selection
    lane: pipeline
    goal: "Each endpoint encodes from the canvas it selected or refuses to start with a reason."
    owns: [output.canvas-selection]
    needs: [endpoint-model]
    code:
      - src/core/CanvasResolve.hpp
      - src/core/CanvasResolve.cpp
      - src/pipeline/CanvasLookup.hpp
      - src/pipeline/CanvasLookup.cpp
      - tests/test_canvas_resolve.cpp
    works_when:
      - id: canvas-selection.resolve
        behavior: "A canvas ref resolves: empty or main -> main; uuid first, then name; unknown ref or canvas without video mix -> refused with a reason."
        verification:
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_empty_ref_is_main
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_miss_name_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_both_miss_refused
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_without_video_refused
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_ref_to_main_canvas_is_main
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
      - id: canvas-selection.encoder-uses-canvas
        behavior: "start() and every reconnect attempt resolve the endpoint's canvas and attach the video encoder to that canvas's own video_t (main canvas: obs_get_video()); a refused ref ends in FailedHard with the reason and no encoders. No per-output framing conversion is requested (libobs ignores it for encoded outputs). The resolver is covered by the canvas_resolve cases; the OBS adapter (CanvasLookup, encoder attach) is only compiled, not run."
        verification:
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; covers the resolver only; plugin target compiled with cmake --build build_tests --target streammulticast (TASK-6)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: TikTok endpoint bound to the vertical canvas must encode 1080x1920 (not run in this session)"
            result: pending
    status: building
  - id: scene-link
    lane: core
    goal: "The vertical canvas follows the main program scene through a pure name-based link."
    owns: [link.scene-resolution]
    needs: []
    code:
      - src/core/SceneLink.hpp
      - src/core/SceneLink.cpp
      - tests/test_scene_link.cpp
    works_when:
      - id: scene-link.resolve
        behavior: "resolve_linked_scene(main, settings, vertical scenes): link off -> keep; explicit entry naming an existing scene -> it; explicit empty -> keep; explicit entry naming a missing scene -> default rule; default rule is vertical 'V <main>', then vertical '<main>', else keep. Renames migrate explicit keys and values (rename_scene_in_links); linked_switch_delay_ms returns the stinger's transition_point in ms (frames converted with the main fps) and 0 for every other transition; settings round-trip through obs_data (keys streammulticast_vertical_links, streammulticast_vertical_link_enabled)."
        verification:
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_default_prefers_v_prefix
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed before implementation (configure error, missing SceneLink.cpp), 10/10 passed after (TASK-23)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_explicit_missing_falls_back
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed before implementation (configure error, missing SceneLink.cpp), 10/10 passed after (TASK-23)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_disabled_never_switches
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed before implementation (configure error, missing SceneLink.cpp), 10/10 passed after (TASK-23)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_stinger_delay_uses_transition_point
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; 12/12 passed after fix round 1 (TASK-23)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_non_stinger_switches_immediately
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; 12/12 passed after fix round 1 (TASK-23)"
            checked_at: 2026-10-19
      - id: scene-link.immediate-switch-default
        behavior: "SceneLinkSettings.wait_for_stinger defaults to false and round-trips through obs_data (key streammulticast_vertical_link_wait_stinger, missing -> false). linked_switch_delay_ms(settings, ...) returns 0 (switch at transition_start, simultaneous with the main transition) unless wait_for_stinger is on; then it returns the stinger delay of linked_switch_delay_ms(id, ...)."
        verification:
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_switch_immediate_by_default
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed to compile before implementation (no SceneLinkSettings::wait_for_stinger), 15/15 passed after (TASK-27)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_wait_for_stinger_keeps_delay
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed to compile before implementation (no SceneLinkSettings::wait_for_stinger), 15/15 passed after (TASK-27)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_scene_link.cpp
            check: scene_link_wait_for_stinger_persisted
            result: passed
            run: "ctest --test-dir build_tests -C Release -R scene_link_, local run 2026-10-19; failed to compile before implementation (no SceneLinkSettings::wait_for_stinger), 15/15 passed after (TASK-27)"
            checked_at: 2026-10-19
    status: building
  - id: owned-vertical-canvas
    lane: pipeline
    goal: "The plugin owns exactly one vertical canvas and endpoints on it stop cleanly when it goes away."
    owns: [canvas.owned-vertical-identity]
    needs: [canvas-selection, endpoint-model, scene-link]
    code:
      - src/core/OwnedCanvasPolicy.hpp
      - src/core/OwnedCanvasPolicy.cpp
      - src/pipeline/OwnedCanvas.hpp
      - src/pipeline/OwnedCanvas.cpp
      - src/pipeline/CanvasSceneNames.hpp
      - src/pipeline/CanvasSceneNames.cpp
      - src/core/CanvasScaleRef.hpp
      - src/core/CanvasScaleRef.cpp
      - tests/test_canvas_owned.cpp
      - tests/test_canvas_scale_ref.cpp
    works_when:
      - id: owned-vertical-canvas.create-or-reuse
        behavior: "The canvas named StreamMulticast Vertical is matched by exact name: absent -> create, present with video -> reuse, present without video -> reuse and reset video; similar names never match."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_creates_when_absent
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
          - kind: automated
