    works_when:
      - id: streamlabs-tiktok.parse
        behavior: "info/search/start/end requests use https://streamlabs.com/api/v5/slobs/tiktok (search query cut to 25 code points and url-encoded; start is multipart title, device_platform=win32, category=<game_mask_id or ''>, audience_type=0); start needs id, rtmp and key (any missing = MissingField error); info reads user.username, application_status.status, can_be_live (only JSON true); search always appends {Other, ''}; end needs success=true. Error messages never contain the token, key, rtmp URL or body; a body that is not one well-formed JSON object (also invalid or overlong UTF-8, UTF-8 surrogates, \\u0000, lone surrogate escapes, integers outside int64, non-finite reals, duplicate keys) is rejected before the libobs parser can log a fragment of it. The generator config.json 'token' is accepted when non-empty, printable ASCII and at most 512 characters; a file with a top-level 'endpoints' array (the StreamMulticast config) is refused with \"This is the StreamMulticast config, not the generator's config.json. Pick the config.json next to StreamLabsTikTokStreamKeyGenerator.exe.\" and no token is taken from it (TASK-29). One user agent constant (Streamlabs Desktop Electron)."
