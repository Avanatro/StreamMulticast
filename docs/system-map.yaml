            result: pending
      - id: ui-vertical-dock.dropdowns-readable
        behavior: "Dropdowns in the vertical dock (Links tab combos in table cells) and the endpoint dialog (Video canvas) carry no hard-coded colours, so the OBS theme styles them. Table-cell combos get a minimum contents length, a minimum column width and a row height from the combo sizeHint, so the theme's fixed input height plus margins cannot squash the selected text. Only compiled locally, not run in OBS."
