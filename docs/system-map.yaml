  - id: streamlabs-login
    lane: core
    goal: "The Streamlabs browser login (PKCE, local callback, code exchange) and the Streamlabs Desktop token scan are described and parsed without network, sockets, OBS runtime or Qt, and no error text carries the code, verifier or token."
    owns: [streamlabs.login-pkce, streamlabs.login-parsing, streamlabs.desktop-token-scan]
    needs: [streamlabs-tiktok]
    code:
      - src/core/StreamlabsLogin.hpp
      - src/core/StreamlabsLogin.cpp
      - tests/test_streamlabs_login.cpp
    works_when:
      - id: streamlabs-login.parse
        behavior: "PKCE: verifier = the 64 given random bytes as lowercase hex (128 chars), challenge = base64url(sha256(verifier ASCII)) without padding (own SHA-256, FIPS vectors tested); any other byte count gives no pair. Login URL https://streamlabs.com/slobs/login?skip_splash=true&external=electron&tiktok&force_verify&origin=slobs&port=<1..65535>&code_challenge=<challenge>&code_flow=true. Callback parser: only 'GET <any path>?<query> HTTP/x' within 8 KiB; no request line yet = Incomplete; no success/code parameter, other method or garbage = NotCallback (answered 404, keep waiting); success exactly 'true' plus a percent-decoded code of 1..2048 printable ASCII = Code; anything else with success or code = Failed. Exchange: GET https://streamlabs.com/api/v5/slobs/auth/data?code_verifier=<v>&code=<url-encoded code>; HTTP 200 + JSON success true + data.oauth_token (non-empty printable ASCII, at most 512, shared rule streamlabs_token_text_ok) = token; the strict JSON pre-check of streamlabs-tiktok runs before libobs parses. Desktop scan: the last apiToken entry (quote apiToken quote colon quote hex quote) whose value is 16..128 hex characters; other occurrences are skipped. Error messages never contain the code, verifier, token or body."
