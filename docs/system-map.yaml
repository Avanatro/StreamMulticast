    works_when:
      - id: main-stream-linking.linked-start
        behavior: "Streaming-started event starts only endpoints that are enabled and linked to the main stream. Selection is the pure function select_linked_for_start; the event wiring in plugin-main.cpp is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_linked_start.cpp
            check: linked_start_skips_disabled_endpoints
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix (disabled endpoint selected), passed after (WU3 commit)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: start main stream with one disabled linked endpoint; it must not start (not run in this session)"
            result: pending
      - id: main-stream-linking.skip-duplicate
        behavior: "A linked endpoint whose server and key equal the OBS main stream or an earlier selected endpoint is not started; a warning with the endpoint name (never the key) is logged. Planning is the pure function plan_linked_start; the event wiring is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_linked_start_duplicates.cpp
            check: plan_skips_endpoint_equal_to_main_service
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_linked_start_duplicates.cpp
            check: plan_first_of_two_duplicate_endpoints_wins
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
    status: building
  - id: ui-endpoint-dialog
    lane: ui
    goal: "User edits one endpoint with import helpers and validation."
    owns: [ui.endpoint-form]
