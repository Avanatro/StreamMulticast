  - id: streamlabs-token-vault
    lane: pipeline
    goal: "The imported Streamlabs token is kept encrypted for the current Windows user and is never stored in plain text."
    owns: [streamlabs.token-storage]
    needs: []
    code:
      - src/pipeline/StreamlabsTokenVault.hpp
      - src/pipeline/StreamlabsTokenVault.cpp
    works_when:
      - id: streamlabs-token-vault.dpapi
        behavior: "Only with SMULTI_STREAMLABS_TIKTOK: save() encrypts with CryptProtectData (current user, constant entropy, UI forbidden) and writes obs_module_config_path('streamlabs_tiktok.bin') atomically (temp file, flush, MoveFileEx replace); load() decrypts with CryptUnprotectData; plaintext buffers are wiped (SecureZeroMemory); remove() is Disconnect. The token is never in config.json, never logged, never shown. Compiled (ON build imports CryptProtectData/CryptUnprotectData from CRYPT32.dll), not run."
        verification:
          - kind: manual
            reference: "OBS runtime check (ON build): after the import, streamlabs_tiktok.bin exists in the plugin config folder, contains no readable token text, config.json has no token; Disconnect deletes the file (not run in this session, TASK-28)"
            result: pending
    status: building
  - id: streamlabs-client
    lane: pipeline
    goal: "Streamlabs TikTok calls run off the UI thread over TLS, results reach the UI thread only while the plugin lives, and every started session is ended once."
    owns: [streamlabs.http-transport, streamlabs.session-lifecycle]
    needs: [streamlabs-tiktok, streamlabs-token-vault, streamlabs-login]
    code:
      - src/pipeline/StreamlabsClient.hpp
      - src/pipeline/StreamlabsClient.cpp
    works_when:
      - id: streamlabs-client.session
        behavior: "Only with SMULTI_STREAMLABS_TIKTOK: one FIFO worker thread does WinHTTP calls (https only, TLS 1.2+, 15 s timeouts, 5 s for end; authorization Bearer and the Streamlabs Desktop user agent); results are posted to the UI thread through plugin-main's post_to_ui and dropped after shutdown (shared alive flag). start_session ends a still-open or crash-left session first (id persisted in obs_module_config_path('streamlabs_tiktok_session.txt'), never the key), then starts; a result nobody adopts is ended again; a second endpoint is refused while another owns the session. end_session runs at most once per session. shutdown_and_end_blocking (OBS exit, unload, before the UI post context is deleted) cancels the in-flight request by closing its handle, joins the worker and ends open sessions synchronously, bounded to 5 s each. exchange_login (TASK-32) runs the browser login code exchange on the same worker without an authorization header and posts the parsed token result to the UI thread (wiped after the callback). Logs one info line per start/end ('streamlabs tiktok: session started for '<name>'' / 'session ended (success=<bool>)'), never the token, key, rtmp URL or a body. Compiled (ON build imports WinHttpOpen from WINHTTP.dll; OFF build imports neither WINHTTP nor CRYPT32), no real network call made."
        verification:
          - kind: manual
            reference: "OBS runtime check (ON build): go live, stop, quit OBS while live; the log has exactly one 'session started' and one 'session ended (success=true)' per session and no token or key; kill OBS while live, restart and go live: 'ending a previous session before a new start' appears first (not run in this session, TASK-28)"
            result: pending
      - id: streamlabs-client.session-book
        behavior: "StreamlabsSessionBook (pure core, used under the client mutex) decides which id is ended: an id is ended successfully at most once; a start result nobody adopted ends exactly its own id and only while it is still the open one (never a newer session of the endpoint); an end cut off at shutdown, a queued end dropped at shutdown and an open session nobody adopted are each ended once by the synchronous shutdown end. shutdown_and_end_blocking lets the in-flight job finish for up to 5 s before it cancels it."
        verification:
          - kind: automated
            reference: tests/test_streamlabs_tiktok.cpp
            check: streamlabs_tiktok_session_unadopted_ends_only_that_id
            result: passed
            run: "ctest --test-dir build_tests -C Release -R streamlabs_tiktok_, local run 2026-10-19 (TASK-28 fix round 1); failed to compile before StreamlabsSessionBook existed, 16/16 passed after"
