schema_version: 1
project: StreamMulticast

# DRAFT: bootstrap map, owner review pending. No node is promoted to works.
lanes:
  foundation: "#3498db"
  core: "#2ecc71"
  pipeline: "#f39c12"
  ui: "#9b59b6"
  entry: "#e74c3c"

rules:
  - "Draft map from a read-only audit on 2026-10-19; unverified claims are marked UNVERIFIED in criteria."
  - "Platform URLs live in one table only (currently violated: two tables)."

ignore:
  - ".deps/**"
  - "build_x64/**"
  - "build_x64_vs18/**"
  - "build-aux/**"
  - "cmake/**"
  - "**/*.subagent"
  - "*.subagent"

# Generated or pre-existing untracked files that are not part of this change.
size_ignore:
  - "build_x64_vs18/**"
  - "build_tests/**"
  - "cmake/.CMakeBuildNumber"
  - "**/*.subagent"
  - "*.subagent"

nodes:
  - id: endpoint-model
    lane: foundation
    goal: "An endpoint is a plain value with identity, connection, encoder and framing settings."
    owns: [endpoint.fields-and-defaults, endpoint.uuid-identity]
    needs: []
    code:
      - src/core/Endpoint.hpp
      - src/core/Endpoint.cpp
      - src/core/CanvasMigration.hpp
      - src/core/CanvasMigration.cpp
      - tests/test_endpoint_defaults.cpp
      - tests/test_canvas_endpoint.cpp
    works_when:
      - id: endpoint-model.shape
        behavior: "Endpoint round-trips through obs_data without loss; missing keys get documented defaults."
        verification:
          - kind: automated
            reference: tests/test_endpoint_defaults.cpp
            check: endpoint_missing_bools_deserialize_to_defaults
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix (enabled/linked_to_main read false), passed after (WU2 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_endpoint_defaults.cpp
            check: endpoint_missing_numbers_deserialize_to_defaults
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix, passed after (WU2 commit)"
            checked_at: 2026-10-19
      - id: endpoint-model.canvas-ref
        behavior: "Endpoint carries canvas_uuid and canvas_name (both empty = main canvas), serialized as canvas_uuid/canvas_name; configs without the keys resolve to the main canvas."
        verification:
          - kind: automated
            reference: tests/test_canvas_endpoint.cpp
            check: canvas_endpoint_roundtrip_preserves_canvas_ref
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_, local run 2026-10-19; failed before implementation (build error, missing CanvasMigration.hpp), passed after (TASK-3)"
            checked_at: 2026-10-19
    status: building
  - id: config-persistence
    lane: foundation
    goal: "Endpoint list survives restarts, debounced and crash-safe."
    owns: [config.file-schema, config.schema-version]
    needs: [endpoint-model]
    code:
      - src/core/ConfigStore.hpp
      - src/core/ConfigStore.cpp
    works_when:
      - id: config-persistence.roundtrip
        behavior: "Saved config.json loads back to an equal endpoint list; legacy schema versions are migrated."
        verification: []
      - id: config-persistence.legacy-orientation-migration
        behavior: "Schema 1 -> 2: orientation 1/2 becomes canvas_name 'StreamMulticast Vertical' with orientation SourceMatch, one LOG_WARNING per migrated endpoint (name only). The pure migration is tested; the ConfigStore load path and the log line are not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_canvas_endpoint.cpp
            check: canvas_migrate_letterbox_to_vertical_canvas
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_, local run 2026-10-19; failed before implementation (build error), passed after (TASK-3)"
            checked_at: 2026-10-19
    status: building
  - id: platform-server-table
    lane: foundation
    goal: "One table maps platform names to ingest URLs."
    owns: [platform.server-url-table]
    needs: []
    code:
      - src/core/ObsServiceImport.cpp
      - src/ui/EndpointDialog.cpp
    works_when:
      - id: platform-server-table.to-be-mapped
        behavior: "unknown - to be mapped. Two independent tables exist today (ObsServiceImport.cpp:29 and EndpointDialog.cpp:31) with different YouTube and Kick URLs."
        verification: []
    status: unknown
  - id: service-import
    lane: core
    goal: "Server and key can be imported from the active OBS profile or a TikTok bridge JSON."
    owns: [import.obs-profile-reader, import.tiktok-bridge-reader]
    needs: [platform-server-table]
    code:
      - src/core/ObsServiceImport.hpp
      - src/core/ObsServiceImport.cpp
      - src/core/TikTokBridgeImport.hpp
      - src/core/TikTokBridgeImport.cpp
    works_when:
      - id: service-import.obs-profile
        behavior: "Active-profile service.json yields server, key, service name or a readable error."
        verification: []
    status: building
  - id: endpoint-validation
    lane: core
    goal: "Invalid or duplicate endpoints (empty fields, bad scheme, same ingest and key twice) are rejected or warned before start."
    owns: [endpoint.validation-rules]
    needs: [endpoint-model]
    code:
      - src/core/EndpointValidation.hpp
      - src/core/EndpointValidation.cpp
      - src/core/MainServiceTarget.hpp
      - src/core/MainServiceTarget.cpp
      - tests/test_endpoint_validation.cpp
      - tests/test_linked_start_duplicates.cpp
    works_when:
      - id: endpoint-validation.dup-target
        behavior: "Two targets are duplicates when the normalized server (trimmed, scheme and host lowercased, trailing slashes and the scheme default port rtmp:1935 / rtmps:443 stripped; rtmp and rtmps stay distinct) and the non-empty stream key are equal. Checked against other enabled endpoints and the OBS main streaming service. The check is pure (find_duplicate); reading the main service via the frontend API (MainServiceTarget) is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_endpoint_validation.cpp
            check: duplicate_when_normalized_server_and_key_equal
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_endpoint_validation.cpp
            check: find_duplicate_detects_main_service
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: main service and a linked endpoint with identical server and key; the endpoint must be skipped with a warning in the log (not run in this session)"
            result: pending
    status: building
  - id: encoder-factory
    lane: pipeline
    goal: "Each endpoint gets a video and audio encoder matching its settings, with safe fallback."
    owns: [encoder.type-resolution, encoder.settings-mapping]
    needs: [endpoint-model]
    code:
      - src/pipeline/EncoderFactory.hpp
      - src/pipeline/EncoderFactory.cpp
    works_when:
      - id: encoder-factory.fallback
        behavior: "Unavailable GPU backend falls back to x264 with a log line."
        verification: []
    status: building
  - id: canvas-selection
    lane: pipeline
    goal: "Each endpoint encodes from the canvas it selected or refuses to start with a reason."
    owns: [output.canvas-selection]
    needs: [endpoint-model]
    code:
      - src/core/CanvasResolve.hpp
      - src/core/CanvasResolve.cpp
      - src/pipeline/CanvasLookup.hpp
      - src/pipeline/CanvasLookup.cpp
      - tests/test_canvas_resolve.cpp
    works_when:
      - id: canvas-selection.resolve
        behavior: "A canvas ref resolves: empty or main -> main; uuid first, then name; unknown ref or canvas without video mix -> refused with a reason."
        verification:
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_empty_ref_is_main
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_miss_name_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_both_miss_refused
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_without_video_refused
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_ref_to_main_canvas_is_main
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; failed before implementation (configure error, missing CanvasResolve.cpp), passed after (TASK-4)"
            checked_at: 2026-10-19
      - id: canvas-selection.encoder-uses-canvas
        behavior: "start() and every reconnect attempt resolve the endpoint's canvas and attach the video encoder to that canvas's own video_t (main canvas: obs_get_video()); a refused ref ends in FailedHard with the reason and no encoders. No per-output framing conversion is requested (libobs ignores it for encoded outputs). The resolver is covered by the canvas_resolve cases; the OBS adapter (CanvasLookup, encoder attach) is only compiled, not run."
        verification:
          - kind: automated
            reference: tests/test_canvas_resolve.cpp
            check: canvas_resolve_uuid_hit
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_resolve, local run 2026-10-19; covers the resolver only; plugin target compiled with cmake --build build_tests --target streammulticast (TASK-6)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: TikTok endpoint bound to the vertical canvas must encode 1080x1920 (not run in this session)"
            result: pending
    status: building
  - id: owned-vertical-canvas
    lane: pipeline
    goal: "The plugin owns exactly one vertical canvas and endpoints on it stop cleanly when it goes away."
    owns: [canvas.owned-vertical-identity]
    needs: [canvas-selection, endpoint-model]
    code:
      - src/core/OwnedCanvasPolicy.hpp
      - src/core/OwnedCanvasPolicy.cpp
      - src/pipeline/OwnedCanvas.hpp
      - src/pipeline/OwnedCanvas.cpp
      - tests/test_canvas_owned.cpp
    works_when:
      - id: owned-vertical-canvas.create-or-reuse
        behavior: "The canvas named StreamMulticast Vertical is matched by exact name: absent -> create, present with video -> reuse, present without video -> reuse and reset video; similar names never match."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_creates_when_absent
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_reuses_existing_by_name
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_reuses_existing_by_name_and_resets_video
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_ignores_similar_names
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.ovi-derivation
        behavior: "Vertical geometry is 1080x1920 for base and output with the main fps copied."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_geometry_from_main_1080p60
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.removal-stops-endpoints
        behavior: "Removing a canvas uuid yields exactly the endpoints bound to it, in order."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_removal_stops_bound_endpoints
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.persisted-single-instance
        behavior: "On FINISHED_LOADING and SCENE_COLLECTION_CHANGED the OBS adapter applies decide_owned_canvas: create via obs_frontend_add_canvas, or reuse an existing canvas of that name (resetting its video when it has none), never a second canvas. It adds an empty scene V Main on channel 0 when the canvas has no scene, and on SCENE_COLLECTION_CHANGING stops the endpoints bound to it. The adapter is only compiled and import-checked locally (plugin target built, dumpbin shows obs_frontend_add_canvas, obs_frontend_get_canvases, obs_canvas_scene_create, obs_canvas_reset_video), not run."
        verification:
          - kind: manual
            reference: "OBS runtime check: restart OBS twice; GetCanvasList shows exactly one StreamMulticast Vertical (not run in this session)"
            result: pending
      - id: owned-vertical-canvas.restart-renders-scene
        behavior: "libobs persists no channel assignment for a non-main canvas, so the scene name on channel 0 is stored in the collection data (save callback) and restored on load; with no stored name the first scene is used; an empty canvas gets V Main. The canvas is rebuilt on collection change, profile change and the libobs video_reset signal (main video reset frees every canvas mix)."
        verification:
          - kind: manual
            reference: "OBS runtime check: restart OBS, then change Settings > Video; the V canvas preview renders its scene both times (not run in this session)"
            result: pending
      - id: owned-vertical-canvas.own-mix
        behavior: "The owned canvas has its own video mix (1080x1920, main fps) independent of whether Aitum Vertical is active; Aitum's canvas and the V scenes are never written."
        verification:
          - kind: manual
            reference: "OBS runtime check: GetCanvasList video settings of StreamMulticast Vertical are non-null while Aitum Vertical is inactive (not run in this session)"
            result: pending
    status: building
  - id: controller-reaper
    lane: pipeline
    goal: "Blocking output teardown never runs on the UI thread."
    owns: [reaper.teardown-thread]
    needs: []
    code:
      - src/pipeline/ControllerReaper.hpp
      - src/pipeline/ControllerReaper.cpp
    works_when:
      - id: controller-reaper.drain
        behavior: "Queued teardown jobs finish before module unload."
        verification: []
    status: building
  - id: output-lifecycle
    lane: pipeline
    goal: "One endpoint streams, reconnects with backoff and stops without blocking the UI."
    owns: [output.state-machine, output.reconnect-policy, output.libobs-objects]
    needs: [encoder-factory, canvas-selection, controller-reaper]
    code:
      - src/pipeline/OutputController.hpp
      - src/pipeline/OutputController.cpp
    works_when:
      - id: output-lifecycle.backoff
        behavior: "reconnect_delay_seconds follows 1/2/5/10/30/60 and -1 after max attempts."
        verification: []
      - id: output-lifecycle.stop-nonblocking
        behavior: "stop() returns without calling blocking libobs functions."
        verification: []
      - id: output-lifecycle.canvas-removed-stop
        behavior: "The controller holds a strong ref on its canvas while live and stops the endpoint (non-blocking stop path, no reconnect) when the canvas emits remove or destroy; the ref is released after encoders and output. stop() is idempotent. Not covered by an automated check."
        verification:
          - kind: manual
            reference: "OBS runtime check: remove the vertical canvas (or switch scene collection) while an endpoint streams on it; the endpoint must stop, the log must show \"canvas '<name>' removed, stopping endpoint\", OBS must not crash and no reconnect may start (not run in this session)"
            result: pending
    status: building
  - id: endpoint-registry
    lane: core
    goal: "The live endpoint list and its controllers stay consistent and observable."
    owns: [registry.endpoint-list, registry.controller-map]
    needs: [endpoint-model, config-persistence, output-lifecycle, controller-reaper]
    code:
      - src/core/EndpointRegistry.hpp
      - src/core/EndpointRegistry.cpp
    works_when:
      - id: endpoint-registry.crud
        behavior: "add, update, remove and reorder keep endpoints, controllers and persisted config in step."
        verification: []
    status: building
  - id: health-sampling
    lane: pipeline
    goal: "Per-endpoint live bitrate, drops and state are sampled at 2 Hz."
    owns: [health.snapshots]
    needs: [endpoint-registry, output-lifecycle]
    code:
      - src/pipeline/HealthSampler.hpp
      - src/pipeline/HealthSampler.cpp
    works_when:
      - id: health-sampling.rolling
        behavior: "Actual bitrate is a rolling average reset on inactive transition."
        verification: []
    status: building
  - id: main-stream-linking
    lane: entry
    goal: "Linked, enabled endpoints start and stop with the OBS main stream."
    owns: [link.main-stream-trigger]
    needs: [endpoint-registry, endpoint-validation]
    code:
      - src/plugin-main.cpp
      - src/core/LinkedStart.hpp
      - src/core/LinkedStart.cpp
      - tests/test_linked_start.cpp
    works_when:
      - id: main-stream-linking.linked-start
        behavior: "Streaming-started event starts only endpoints that are enabled and linked to the main stream. Selection is the pure function select_linked_for_start; the event wiring in plugin-main.cpp is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_linked_start.cpp
            check: linked_start_skips_disabled_endpoints
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed before the fix (disabled endpoint selected), passed after (WU3 commit)"
            checked_at: 2026-10-19
          - kind: manual
            reference: "OBS runtime check: start main stream with one disabled linked endpoint; it must not start (not run in this session)"
            result: pending
      - id: main-stream-linking.skip-duplicate
        behavior: "A linked endpoint whose server and key equal the OBS main stream or an earlier selected endpoint is not started; a warning with the endpoint name (never the key) is logged. Planning is the pure function plan_linked_start; the event wiring is not covered by an automated check."
        verification:
          - kind: automated
            reference: tests/test_linked_start_duplicates.cpp
            check: plan_skips_endpoint_equal_to_main_service
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_linked_start_duplicates.cpp
            check: plan_first_of_two_duplicate_endpoints_wins
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19; failed against stub before implementation, passed after (WU4 commit)"
            checked_at: 2026-10-19
    status: building
  - id: ui-endpoint-dialog
    lane: ui
    goal: "User edits one endpoint with import helpers and validation."
    owns: [ui.endpoint-form]
    needs: [endpoint-model, service-import, encoder-factory, platform-server-table, endpoint-validation, canvas-selection]
    code:
      - src/ui/EndpointDialog.hpp
      - src/ui/EndpointDialog.cpp
    works_when:
      - id: ui-endpoint-dialog.save-validation
        behavior: "Save rejects empty name, server or key, and warns (user may still save) when server and key duplicate another enabled endpoint or the OBS main stream. The dialog wiring is not covered by an automated check."
        verification:
          - kind: manual
            reference: "OBS runtime check: save an endpoint with the same server and key as another one; a warning must appear and Yes must still save (not run in this session)"
            result: pending
      - id: ui-endpoint-dialog.canvas-selector
        behavior: "The dialog offers Main canvas, then every canvas from snapshot_canvases() with the plugin-owned one first, and saves the chosen uuid and name; a stored canvas that no longer exists stays selected as '<name> (missing)'. The dialog never writes a legacy orientation (always SourceMatch). The TikTok bridge import selects StreamMulticast Vertical."
        verification:
          - kind: manual
            reference: "OBS runtime check: the dialog lists Main, StreamMulticast Vertical and Aitum Vertical; saving keeps uuid and name (not run in this session; plugin target compiled with cmake --build build_tests --target streammulticast, TASK-8)"
            result: pending
    status: building
  - id: ui-config-tab
    lane: ui
    goal: "User sees, reorders, toggles and deletes endpoints."
    owns: [ui.config-tab]
    needs: [endpoint-registry, ui-endpoint-dialog]
    code:
      - src/ui/ConfigTab.hpp
      - src/ui/ConfigTab.cpp
    works_when:
      - id: ui-config-tab.crud-ui
        behavior: "Add, edit, toggle, delete and reorder reach the registry."
        verification: []
    status: building
  - id: ui-health-tab
    lane: ui
    goal: "User sees live health per endpoint."
    owns: [ui.health-tab]
    needs: [health-sampling]
    code:
      - src/ui/HealthTab.hpp
      - src/ui/HealthTab.cpp
    works_when:
      - id: ui-health-tab.grid
        behavior: "Health grid updates incrementally each tick."
        verification: []
    status: building
  - id: ui-dock
    lane: ui
    goal: "One OBS dock hosts the config and health tabs."
    owns: [ui.dock]
    needs: [ui-config-tab, ui-health-tab]
    code:
      - src/ui/MultistreamDock.hpp
      - src/ui/MultistreamDock.cpp
    works_when:
      - id: ui-dock.dock
        behavior: "Dock registers once and is removed on unload."
        verification: []
    status: building
  - id: plugin-entry
    lane: entry
    goal: "Module load wires singletons in order and unload tears them down without blocking."
    owns: [module.lifecycle-wiring]
    needs: [config-persistence, endpoint-registry, health-sampling, controller-reaper, ui-dock, main-stream-linking, owned-vertical-canvas]
    code:
      - src/plugin-main.cpp
      - src/plugin-support.h
      - src/plugin-support.c.in
    works_when:
      - id: plugin-entry.load-unload
        behavior: "Load then unload leaves no running threads or dangling references."
        verification: []
    status: building
  - id: test-harness
    lane: foundation
    goal: "Pure logic has automated tests runnable without OBS."
    owns: [test.pure-logic-harness]
    needs: []
    code:
      - tests/CMakeLists.txt
      - tests/TestRunner.hpp
      - tests/main.cpp
      - tests/test_endpoint_roundtrip.cpp
    works_when:
      - id: test-harness.runs-without-obs
        behavior: "ctest runs unit tests that link libobs util only (obs_data), without obs_startup, frontend API or Qt. Enabled with -DBUILD_TESTING=ON; the plugin build is unchanged."
        verification:
          - kind: automated
            reference: tests/test_endpoint_roundtrip.cpp
            check: endpoint_roundtrip_preserves_all_fields
            result: passed
            run: "ctest --test-dir build_tests -C RelWithDebInfo, local run 2026-10-19 (WU1 commit)"
            checked_at: 2026-10-19
      - id: test-harness.per-case-selection
        behavior: "ctest -R <prefix> selects individual cases: every SMULTI_TEST case is its own ctest test, registered at configure time from the test sources."
        verification:
          - kind: automated
            reference: tests/TestRunner.hpp
            check: run_one
            result: passed
            run: "ctest --test-dir build_tests -C Release -N lists 36 tests (34 cases + streammulticast_tests + harness_unknown_case_fails); full ctest 36/36 passed; -R endpoint_roundtrip runs 1 test; local run 2026-10-19"
            checked_at: 2026-10-19
    status: building
  - id: build-ci
    lane: foundation
    goal: "Windows plugin builds reproducibly against pinned libobs."
    owns: [build.windows-ci]
    needs: []
    code:
      - CMakeLists.txt
      - buildspec.json
      - .github/workflows/build-windows.yaml
    works_when:
      - id: build-ci.to-be-mapped
        behavior: "unknown - to be mapped. Headers are pinned to 31.1.1, field use is OBS 32.1."
        verification: []
    status: unknown
