  - id: streamlabs-tiktok
    lane: core
    goal: "Streamlabs TikTok requests are described and their answers parsed without network, OBS runtime or Qt, and no error text carries a secret."
    owns: [streamlabs.request-shapes, streamlabs.response-parsing, streamlabs.token-import]
