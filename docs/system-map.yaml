            result: pending
      - id: ui-vertical-dock.scene-list
        behavior: "The Scenes tab lists the scenes of the owned canvas only (obs_canvas_enum_scenes) and marks the one on channel 0. Add creates a uniquely named scene (obs_canvas_scene_create); Rename (obs_source_set_name) rejects empty and duplicate names; Remove asks for confirmation, refuses the last scene, moves channel 0 to another scene when needed and calls obs_canvas_scene_remove only after checking obs_source_get_canvas(scene) is the owned canvas; Set active uses obs_canvas_set_channel(owned, 0, scene), the channel OwnedCanvas saves and restores. The list refreshes on the canvas signals source_add/source_remove/source_rename/channel_change (queued, coalesced) and on collection events; canvas, scene and source refs are taken and released within one UI-thread function, and the signals are disconnected before the canvas is released (canvas_remove, collection changing, SCRIPTING_SHUTDOWN, unload). Only compiled locally (plugin target built), not run in OBS."
        verification:
          - kind: manual
            reference: "OBS runtime check: add, rename, remove and set active change the preview; the active scene survives an OBS restart; switching scene collection and quitting OBS do not crash (not run in this session; plugin target compiled with cmake --build build_tests --target streammulticast, TASK-11)"
            result: pending
      - id: ui-vertical-dock.items-and-transform
        behavior: "The Sources tab lists the items of the active scene (channel 0) of the owned canvas, top item first. Add source offers the existing inputs (obs_enum_sources, type input) and calls obs_scene_add (adds a reference, the input is not modified); Remove (confirmed) calls obs_sceneitem_remove; Up/Down use obs_sceneitem_set_order; the checkbox uses obs_sceneitem_set_visible. The transform panel applies Fit and Fill (smulti::layout::fit / fill with obs_source_get_width/height and 1080x1920) and numeric pos/scale/crop (layout::clamp_crop), written in one obs_sceneitem_defer_update_begin/end block with OBS_BOUNDS_NONE; Fit/Fill also reset alignment to top-left and rotation to 0, numeric Apply keeps both. Scene item refs are taken and released inside one UI-thread call (items are tracked by id plus the uuid of their scene, because ids are per scene; a switched active scene refuses the access and clears the selection; item_transform only reloads the transform panel); writes only happen after checking the scene belongs to the owned canvas. The list refreshes (queued, coalesced) on canvas channel_change/source_remove/source_rename and the active scene's item_add/item_remove/reorder/item_visible/item_transform/refresh; all signals are detached before the canvas is released, and every entry point returns early after shutdown. Only compiled locally (plugin target built), not run in OBS."
        verification:
          - kind: manual
            reference: "OBS runtime check: Fill on the webcam source fills 1080x1920 centred; numeric edits move the item; add, remove, reorder and visibility change the preview; switching scene collection and quitting OBS do not crash (not run in this session; plugin target compiled with cmake --build build_tests --target streammulticast, TASK-12)"
            result: pending
      - id: ui-vertical-dock.import-scenes
        behavior: "The Scenes tab has \"Import scenes from canvas...\": a modal dialog lists every canvas from snapshot_canvases except the main and the owned one, with their scenes (obs_canvas_enum_scenes) as checkboxes; scenes that contain a group are shown disabled, because OBS_SCENE_DUP_REFS shares the group source and obs_canvas_move_scene would pull it out of the original canvas. Per selected scene import_scene() takes the refs, re-checks that the scene belongs to the chosen canvas, duplicates it with obs_scene_duplicate(OBS_SCENE_DUP_REFS) under a temporary unique name (libobs creates the copy in the SOURCE canvas and shares the child sources, nothing private is created), moves only the copy with obs_canvas_move_scene(copy, owned), verifies obs_source_get_canvas(copy) is the owned canvas (pointer and uuid), then renames it to a free name (\"Name\", \"Name (2)\", ...). On a failed move the stranded temporary name is reported and nothing is removed from the foreign canvas. The source canvas scene names are compared before and after (INV-6). The original scene is never passed to move, rename or remove. Only compiled locally (plugin target built), not run in OBS."
        verification:
          - kind: manual
            reference: "OBS runtime check: import V Just Chatting from Aitum Vertical; the copy appears in the StreamMulticast Vertical Scenes tab with the shared webcam source, Aitum still lists its four V scenes with unchanged names (not run in this session; plugin target compiled with cmake --build build_tests --target streammulticast, TASK-13)"
