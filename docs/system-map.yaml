  - id: streamlabs-login-flow
    lane: pipeline
    goal: "The user logs in to Streamlabs from the endpoint dialog (browser or Streamlabs Desktop login), and the token lands in the vault without the external generator program."
    owns: [streamlabs.login-flow, streamlabs.desktop-import]
    needs: [streamlabs-login, streamlabs-client, streamlabs-token-vault]
    code:
      - src/pipeline/StreamlabsLoginFlow.hpp
      - src/pipeline/StreamlabsLoginFlow.cpp
    works_when:
      - id: streamlabs-login-flow.browser-login
        behavior: "Only with SMULTI_STREAMLABS_TIKTOK: start() takes 64 bytes from BCryptGenRandom, binds a TCP listener to 127.0.0.1:0 (never 0.0.0.0, SO_EXCLUSIVEADDRUSE), opens the login URL with QDesktopServices::openUrl on the UI thread, and a worker thread accepts connections until a valid callback, 300 s or cancel (250 ms poll); each request is read up to 8 KiB / 5 s; other requests get 404; the callback gets a small 'You can close this tab' page. The code is exchanged through StreamlabsClient::exchange_login (same worker, no authorization header, url/path wiped after the request); on success the token is saved in the vault and the dialog's info call shows 'Connected as @user'. cancel() (Cancel button, dialog finished, destructor, StreamlabsLoginFlow::shutdown_all from plugin-main at OBS exit and unload before the client shuts down) drops late results (alive flag); the thread closes the socket and is joined. Verifier, code and token copies are wiped after use and never logged. streamlabs_desktop_import reads only the newest *.log in %APPDATA%/slobs-client/Local Storage/leveldb (missing folder = message; FILE_SHARE_READ|WRITE|DELETE, read-only, at most 64 MiB), scans it with streamlabs-login and stores the token. Compiled (ON build imports WS2_32.dll and BCryptGenRandom from bcrypt.dll; OFF build imports neither), no real network, browser or Streamlabs Desktop file used."
        verification:
          - kind: manual
            reference: "OBS runtime check (ON build): Dima clicks 'Log in with Streamlabs…', logs in in the browser, the tab says 'You can close this tab', the dialog shows 'Connected as @user'; Cancel while waiting restores the buttons; with Streamlabs Desktop logged in, 'Use Streamlabs Desktop login' connects (not run in this session, TASK-32)"
            result: pending
