            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_reuses_existing_by_name_and_resets_video
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_ignores_similar_names
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.ovi-derivation
        behavior: "Vertical geometry is 1080x1920 for base and output with the main fps copied."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_geometry_from_main_1080p60
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.removal-stops-endpoints
        behavior: "Removing a canvas uuid yields exactly the endpoints bound to it, in order."
        verification:
          - kind: automated
            reference: tests/test_canvas_owned.cpp
            check: canvas_owned_removal_stops_bound_endpoints
            result: passed
            run: "ctest --test-dir build_tests -C Release -R canvas_owned, local run 2026-10-19; failed before implementation (configure error, missing OwnedCanvasPolicy.cpp), passed after (TASK-5)"
            checked_at: 2026-10-19
      - id: owned-vertical-canvas.persisted-single-instance
        behavior: "On FINISHED_LOADING and SCENE_COLLECTION_CHANGED the OBS adapter applies decide_owned_canvas: create via obs_frontend_add_canvas, or reuse an existing canvas of that name (resetting its video when it has none), never a second canvas. It adds an empty scene V Main on channel 0 when the canvas has no scene, and on SCENE_COLLECTION_CHANGING stops the endpoints bound to it. The adapter is only compiled and import-checked locally (plugin target built, dumpbin shows obs_frontend_add_canvas, obs_frontend_get_canvases, obs_canvas_scene_create, obs_canvas_reset_video), not run."
        verification:
          - kind: manual
            reference: "OBS runtime check: restart OBS twice; GetCanvasList shows exactly one StreamMulticast Vertical (not run in this session)"
            result: pending
      - id: owned-vertical-canvas.restart-renders-scene
        behavior: "libobs persists no channel assignment for a non-main canvas, so the scene name on channel 0 is stored in the collection data (save callback) and restored on load; with no stored name the first scene is used; an empty canvas gets V Main. The canvas is rebuilt on collection change, profile change and the libobs video_reset signal (main video reset frees every canvas mix)."
        verification:
          - kind: manual
            reference: "OBS runtime check: restart OBS, then change Settings > Video; the V canvas preview renders its scene both times (not run in this session)"
            result: pending
      - id: owned-vertical-canvas.scene-link-switch
        behavior: "OwnedCanvas::follow_program_scene() reads the program scene (obs_frontend_get_current_scene), resolves the linked vertical scene with resolve_linked_scene and calls obs_canvas_set_channel(owned, 0, scene) on the owned canvas only, logging one line 'scene link: \"<main>\" -> \"<vertical>\"'; nothing happens when the link is off, nothing matches or the scene is already active. Triggered by OBS_FRONTEND_EVENT_SCENE_CHANGED (program scene; studio preview ignored) and after ensure() on FINISHED_LOADING and SCENE_COLLECTION_CHANGED only (profile change and video reset rebuild the canvas but do not switch, so a manual Set active survives). The frontend emits SCENE_CHANGED only when a transition has finished (OBSBasic::TransitionStopped) or at once for cuts, so it is the authoritative trigger: it cancels any pending timer and switches immediately if the canvas is not already on the linked scene. To switch together with the main transition, the global libobs signal source_transition_start (emitted by obs_transition_start after the destination is set as OBS_TRANSITION_SOURCE_B, for whatever transition is on output channel 0, so per-scene override transitions are covered) is handled: the callback reads the destination scene name and queues it to the UI thread for every transition on channel 0; by default (link option wait_for_stinger off, TASK-27) the switch happens at once there; with the option on, a stinger delays it by its transition_point (linked_switch_delay_ms with the settings; 0 for other transitions) through a single-shot QTimer that holds the scene name only; a newer transition replaces it; it is cancelled on SCENE_CHANGED, collection change, exit, scripting shutdown and unload, and the signal is disconnected on exit, scripting shutdown and unload. Manual (T-bar) transitions are treated like automatic ones. Link settings are saved in the collection data by the existing save callback. Scene renames migrate the entries: owned-canvas scenes via the owned canvas's own source_rename signal (connected in OwnedCanvas::remember, disconnected in release), because libobs emits the global source_rename for main canvases only; main scenes via the global signal. Only compiled locally (plugin target built), not run in OBS."
        verification:
          - kind: manual
            reference: "OBS runtime check: switch the main scene between Gaming, Just Chatting, Dev/Coding, BRB; the vertical preview follows with the V scene; restart OBS and the links persist (not run in this session; plugin target compiled with cmake --build build_tests --target streammulticast, TASK-23)"
            result: pending
      - id: owned-vertical-canvas.scale-ref-repair
        behavior: "ensure() rebases every saved item of an owned-canvas scene whose scale_ref is unusable (zero, negative or not finite, e.g. {0,0} from the TASK-13 import) to the canvas base size: obs_source_save, repair_scene_scale_refs on settings.items, then obs_source_load with every item source held by a ref during the reload. Valid refs and items without scale_ref are untouched, a scene without a broken ref is not reloaded (idempotent), one log line per repaired scene. The decision is the pure repair_scene_scale_refs (src/core/CanvasScaleRef); the OBS adapter is only compiled locally (plugin target built), not run in OBS."
        verification:
          - kind: automated
            reference: tests/test_canvas_scale_ref.cpp
            check: canvas_scale_ref_repair_needs_repair_cases
            result: passed
            run: "ctest --test-dir build_tests -C Release -R 'canvas_scale_ref_|layout_import_', local run 2026-10-19; 7/9 failed against a stub CanvasScaleRef.cpp, 9/9 passed after implementation (TASK-26)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_scale_ref.cpp
            check: canvas_scale_ref_repair_rewrites_zero_refs_to_canvas_size
            result: passed
            run: "ctest --test-dir build_tests -C Release -R 'canvas_scale_ref_|layout_import_', local run 2026-10-19; 7/9 failed against a stub CanvasScaleRef.cpp, 9/9 passed after implementation (TASK-26)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_scale_ref.cpp
            check: canvas_scale_ref_repair_is_idempotent
            result: passed
            run: "ctest --test-dir build_tests -C Release -R 'canvas_scale_ref_|layout_import_', local run 2026-10-19; 7/9 failed against a stub CanvasScaleRef.cpp, 9/9 passed after implementation (TASK-26)"
            checked_at: 2026-10-19
          - kind: automated
            reference: tests/test_canvas_scale_ref.cpp
            check: canvas_scale_ref_repair_keeps_valid_refs
            result: passed
            run: "ctest --test-dir build_tests -C Release -R 'canvas_scale_ref_|layout_import_', local run 2026-10-19; 7/9 failed against a stub CanvasScaleRef.cpp, 9/9 passed after implementation (TASK-26)"
            checked_at: 2026-10-19
