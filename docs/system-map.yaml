      - src/core/EndpointRegistry.cpp
    works_when:
      - id: endpoint-registry.crud
        behavior: "add, update, remove and reorder keep endpoints, controllers and persisted config in step."
        verification: []
    status: building
  - id: health-sampling
    lane: pipeline
    goal: "Per-endpoint live bitrate, drops and state are sampled at 2 Hz."
    owns: [health.snapshots]
